<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sell Item · THEO TECH LTD</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/app.css?v=5">
  <script src="/js/theme.js?v=5"></script>
</head>
<body data-page="sell" data-title="Sell Item">
  <div id="app-content" hidden>
    <div class="row g-3">
      <div class="col-lg-7 col-xl-6">
        <div class="card shadow-sm tt-touch">
          <div class="card-body p-3 p-md-4">
            <form id="sell-form" novalidate>
              <div class="mb-3">
                <label class="form-label fw-semibold" for="search">Product</label>
                <div class="input-group mb-2">
                  <span class="input-group-text"><i class="bi bi-search"></i></span>
                  <input type="search" class="form-control form-control-lg" id="search" placeholder="Type to find a product…" autocomplete="off">
                </div>
                <select class="form-select form-select-lg" id="product" name="productId" size="6" required></select>
                <div class="form-text">Products with no stock left are shown but cannot be sold.</div>
              </div>

              <div class="d-flex align-items-center gap-3 mb-3" id="selected-box" hidden>
                <span id="selected-thumb"></span>
                <div>
                  <div class="fw-semibold" id="selected-name"></div>
                  <div class="text-secondary small" id="selected-meta"></div>
                </div>
              </div>

              <div class="row g-3 align-items-end">
                <div class="col-sm-6">
                  <label class="form-label fw-semibold" for="quantity">Quantity</label>
                  <div class="input-group input-group-lg">
                    <button class="btn btn-outline-secondary" type="button" id="qty-minus"><i class="bi bi-dash-lg"></i></button>
                    <input type="number" class="form-control text-center fw-bold" id="quantity" name="quantity" value="1" min="1" step="1" inputmode="numeric" required>
                    <button class="btn btn-outline-secondary" type="button" id="qty-plus"><i class="bi bi-plus-lg"></i></button>
                  </div>
                  <div class="form-text" id="available-help"></div>
                </div>
                <div class="col-sm-6">
                  <div class="text-secondary small">Unit price</div>
                  <div class="fs-5 tt-money" id="unit-price">—</div>
                </div>
              </div>

              <div class="d-flex align-items-center justify-content-between border-top mt-4 pt-3">
                <div>
                  <div class="text-secondary small">Total</div>
                  <div class="display-6 fw-bold tt-money" id="total">RWF 0</div>
                </div>
                <button class="btn btn-success btn-lg px-4" type="submit" id="sell-btn" disabled>
                  <i class="bi bi-cart-check me-1"></i>SELL
                </button>
              </div>
            </form>
          </div>
        </div>
        <div id="result" class="alert mt-3" role="alert" hidden></div>
      </div>

      <div class="col-lg-5 col-xl-6">
        <div class="card shadow-sm">
          <div class="card-header d-flex align-items-center">
            <span class="fw-semibold"><i class="bi bi-clock-history me-2 text-primary"></i>Sold today</span>
            <a class="btn btn-link btn-sm ms-auto" href="/sales.html">Full history</a>
          </div>
          <div class="table-responsive">
            <table class="table table-sm table-hover align-middle mb-0">
              <thead class="table-light"><tr><th>Time</th><th>Product</th><th class="text-end">Qty</th><th class="text-end">Total</th></tr></thead>
              <tbody id="today-body"></tbody>
              <tfoot class="table-light fw-semibold"><tr><td colspan="2">Today</td><td class="text-end" id="today-qty">0</td><td class="text-end tt-money" id="today-total">RWF 0</td></tr></tfoot>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js?v=5"></script>
  <script src="/js/ui.js?v=5"></script>
  <script src="/js/auth.js?v=5"></script>
  <script src="/js/layout.js?v=5"></script>
  <script>
    document.addEventListener('app:ready', async () => {
      const esc = UI.escapeHtml;
      const form = document.getElementById('sell-form');
      const search = document.getElementById('search');
      const select = document.getElementById('product');
      const qty = document.getElementById('quantity');
      const sellBtn = document.getElementById('sell-btn');
      const result = document.getElementById('result');
      const params = new URLSearchParams(location.search);

      let products = [];
      let selected = null;

      function renderOptions() {
        const q = search.value.trim().toLowerCase();
        const list = products.filter(p => !q || p.name.toLowerCase().includes(q) || (p.categoryName || '').toLowerCase().includes(q));
        select.innerHTML = list.map(p =>
          '<option value="' + p.id + '"' + (p.availableStock <= 0 ? ' disabled' : '') + (selected && selected.id === p.id ? ' selected' : '') + '>' +
            esc(p.name) + ' — ' + esc(UI.money(p.price)) + ' — ' + (p.availableStock <= 0 ? 'OUT OF STOCK' : p.availableStock + ' available') +
          '</option>').join('');
        if (!list.length) select.innerHTML = '<option disabled>No matching product</option>';
        if (selected && !list.some(p => p.id === selected.id)) selected = null;
        update();
      }

      function update() {
        const id = Number(select.value);
        selected = products.find(p => p.id === id) || null;
        const n = Math.max(1, parseInt(qty.value, 10) || 1);
        qty.value = n;
        document.getElementById('unit-price').textContent = selected ? UI.money(selected.price) : '—';
        document.getElementById('total').textContent = selected ? UI.money(Number(selected.price) * n) : 'RWF 0';
        const box = document.getElementById('selected-box');
        box.hidden = !selected;
        if (selected) {
          document.getElementById('selected-thumb').innerHTML = UI.thumb(selected, 'tt-thumb-lg');
          document.getElementById('selected-name').textContent = selected.name;
          document.getElementById('selected-meta').textContent = (selected.categoryName || '') + ' · ' + selected.availableStock + ' available';
        }
        const help = document.getElementById('available-help');
        if (selected) {
          help.textContent = selected.availableStock + ' available';
          help.className = 'form-text ' + (n > selected.availableStock ? 'text-danger fw-semibold' : '');
          qty.max = selected.availableStock;
        } else {
          help.textContent = '';
        }
        sellBtn.disabled = !selected || selected.availableStock <= 0 || n > selected.availableStock;
      }

      async function loadProducts() {
        try {
          products = await Api.get('/api/products');
          renderOptions();
        } catch (err) { UI.showError(err); }
      }

      async function loadToday() {
        try {
          const range = UI.period('today');
          const data = await Api.get('/api/sales', { query: { from: range.from, to: range.to, size: 8, sort: 'soldAt,desc' } });
          const body = document.getElementById('today-body');
          body.innerHTML = data.content.length ? data.content.map(s =>
            '<tr><td class="text-nowrap small">' + esc(UI.time(s.soldAt)) + '</td><td>' + esc(s.productName) + '</td>' +
            '<td class="text-end">' + esc(UI.number(s.quantity)) + '</td><td class="text-end tt-money">' + esc(UI.money(s.total)) + '</td></tr>').join('')
            : '<tr><td colspan="4" class="text-center text-secondary py-3">No sales yet today</td></tr>';
          document.getElementById('today-qty').textContent = UI.number(data.totalQuantity);
          document.getElementById('today-total').textContent = UI.money(data.totalAmount);
        } catch (err) { UI.showError(err); }
      }

      search.addEventListener('input', renderOptions);
      select.addEventListener('change', update);
      qty.addEventListener('input', update);
      document.getElementById('qty-minus').addEventListener('click', () => { qty.value = Math.max(1, (parseInt(qty.value, 10) || 1) - 1); update(); });
      document.getElementById('qty-plus').addEventListener('click', () => { qty.value = (parseInt(qty.value, 10) || 0) + 1; update(); });

      form.addEventListener('submit', async e => {
        e.preventDefault();
        if (!selected) return;
        result.hidden = true;
        UI.setLoading(sellBtn, true);
        try {
          const sale = await Api.post('/api/sales', { productId: selected.id, quantity: Number(qty.value) }, { silent: true });
          result.className = 'alert alert-success mt-3';
          result.innerHTML = '<i class="bi bi-check-circle me-2"></i><strong>Sold</strong> ' + esc(UI.number(sale.quantity)) + ' × ' + esc(sale.productName) +
            ' for <strong>' + esc(UI.money(sale.total)) + '</strong>. Remaining stock: <strong>' + esc(UI.number(sale.remainingStock)) + '</strong>.';
          result.hidden = false;
          qty.value = 1;
          await Promise.all([loadProducts(), loadToday()]);
        } catch (err) {
          result.className = 'alert alert-danger mt-3';
          result.innerHTML = '<i class="bi bi-exclamation-triangle me-2"></i>' + esc(Api.messageFor(err));
          result.hidden = false;
          if (err.code === 'INSUFFICIENT_STOCK') loadProducts();
        } finally {
          UI.setLoading(sellBtn, false);
        }
      });

      await loadProducts();
      if (params.get('productId')) { select.value = params.get('productId'); update(); }
      loadToday();
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sell Items · THEO TECH LTD</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/app.css?v=8">
  <script src="/js/theme.js?v=8"></script>
</head>
<body data-page="sell" data-title="Sell Items">
  <div id="app-content" hidden>
    <div class="row g-3">
      <!-- product picker -->
      <div class="col-lg-5">
        <div class="card shadow-sm h-100 tt-touch">
          <div class="card-header fw-semibold"><i class="bi bi-box-seam me-2 text-primary"></i>Products</div>
          <div class="card-body p-3">
            <div class="input-group mb-2">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input type="search" class="form-control form-control-lg" id="search" placeholder="Type to find a product…" autocomplete="off" autofocus>
            </div>
            <div class="list-group tt-product-list" id="product-list"></div>
            <div class="form-text mt-2">Tap a product to add it to the receipt. Products with no stock left cannot be added.</div>
          </div>
        </div>
      </div>

      <!-- receipt being built -->
      <div class="col-lg-7">
        <div class="card shadow-sm tt-touch">
          <div class="card-header d-flex align-items-center">
            <span class="fw-semibold"><i class="bi bi-receipt me-2 text-success"></i>Receipt</span>
            <span class="badge text-bg-secondary ms-2" id="cart-count">0 items</span>
            <button type="button" class="btn btn-link btn-sm ms-auto text-danger" id="clear-cart" hidden><i class="bi bi-x-circle me-1"></i>Clear</button>
          </div>
          <div class="table-responsive">
            <table class="table align-middle mb-0" id="cart-table">
              <thead class="table-light"><tr><th>Item</th><th class="text-center" style="width:150px">Qty</th><th class="text-end">Price</th><th class="text-end">Total</th><th></th></tr></thead>
              <tbody id="cart-body"><tr><td colspan="5" class="text-center text-secondary py-4">Nothing added yet. Pick products on the left.</td></tr></tbody>
            </table>
          </div>
          <div class="card-body p-3 p-md-4">
            <form id="sell-form" novalidate>
              <div class="row g-3 align-items-end">
                <div class="col-sm-5">
                  <div class="form-check form-switch fs-5 mt-2">
                    <input class="form-check-input" type="checkbox" id="paid" name="paid" checked>
                    <label class="form-check-label" for="paid" id="paid-label">Paid</label>
                  </div>
                  <div class="form-text" id="paid-help">Money received now.</div>
                </div>
                <div class="col-sm-7">
                  <label class="form-label fw-semibold" for="customerName">Customer name <span class="text-secondary fw-normal" id="customer-opt">(optional)</span></label>
                  <input class="form-control" id="customerName" name="customerName" maxlength="120" autocomplete="off" placeholder="Who is buying">
                </div>
              </div>
              <div class="d-flex align-items-center justify-content-between border-top mt-4 pt-3">
                <div>
                  <div class="text-secondary small">Total</div>
                  <div class="display-6 fw-bold tt-money" id="total">RWF 0</div>
                </div>
                <button class="btn btn-success btn-lg px-4" type="submit" id="sell-btn" disabled>
                  <i class="bi bi-cart-check me-1"></i>SELL
                </button>
              </div>
            </form>
          </div>
        </div>

        <div id="result" class="alert mt-3" role="alert" hidden>
          <div id="result-text"></div>
          <div class="mt-2 d-flex gap-2" id="result-actions" hidden>
            <button type="button" class="btn btn-sm btn-primary" id="print-receipt"><i class="bi bi-printer me-1"></i>Print receipt</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="open-receipt"><i class="bi bi-receipt me-1"></i>View receipt</button>
          </div>
        </div>

        <div class="card shadow-sm mt-3">
          <div class="card-header d-flex align-items-center">
            <span class="fw-semibold"><i class="bi bi-clock-history me-2 text-primary"></i>Sold today</span>
            <a class="btn btn-link btn-sm ms-auto" href="/sales.html">Full history</a>
          </div>
          <div class="table-responsive">
            <table class="table table-sm table-hover align-middle mb-0">
              <thead class="table-light"><tr><th>Time</th><th>No.</th><th>Product</th><th class="text-end">Qty</th><th class="text-end">Total</th><th></th></tr></thead>
              <tbody id="today-body"></tbody>
              <tfoot class="table-light fw-semibold"><tr><td colspan="3">Today</td><td class="text-end" id="today-qty">0</td><td class="text-end tt-money" id="today-total">RWF 0</td><td></td></tr></tfoot>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js?v=8"></script>
  <script src="/js/ui.js?v=8"></script>
  <script src="/js/auth.js?v=8"></script>
  <script src="/js/layout.js?v=8"></script>
  <script>
    document.addEventListener('app:ready', async () => {
      const esc = UI.escapeHtml;
      const form = document.getElementById('sell-form');
      const search = document.getElementById('search');
      const list = document.getElementById('product-list');
      const cartBody = document.getElementById('cart-body');
      const sellBtn = document.getElementById('sell-btn');
      const result = document.getElementById('result');
      const resultText = document.getElementById('result-text');
      const resultActions = document.getElementById('result-actions');
      const paidBox = document.getElementById('paid');
      const customerInput = document.getElementById('customerName');
      const params = new URLSearchParams(location.search);

      let products = [];
      const cart = new Map();      // productId -> quantity
      let lastReceipt = null;

      const byId = id => products.find(p => p.id === id);

      // ---- product list ----------------------------------------------------------------------
      function renderList() {
        const q = search.value.trim().toLowerCase();
        const rows = products.filter(p => !q || p.name.toLowerCase().includes(q) || (p.categoryName || '').toLowerCase().includes(q));
        list.innerHTML = rows.length ? rows.map(p => {
          const inCart = cart.get(p.id) || 0;
          const left = p.availableStock - inCart;
          const out = p.availableStock <= 0;
          return '<button type="button" class="list-group-item list-group-item-action d-flex align-items-center gap-2' + (out ? ' disabled text-secondary' : '') + (inCart ? ' active-soft' : '') + '" data-add="' + p.id + '"' + (out ? ' disabled' : '') + '>' +
            UI.thumb(p) +
            '<span class="flex-grow-1"><span class="fw-semibold">' + esc(p.name) + '</span>' +
              '<div class="small text-secondary">' + esc(p.categoryName || '') + ' · ' + (out ? 'OUT OF STOCK' : left + ' available') + '</div></span>' +
            '<span class="text-end"><div class="tt-money fw-semibold">' + esc(UI.money(p.price)) + '</div>' +
              (inCart ? '<span class="badge text-bg-success">' + inCart + ' in receipt</span>' : '<i class="bi bi-plus-circle text-primary fs-5"></i>') + '</span>' +
          '</button>';
        }).join('') : '<div class="list-group-item text-secondary">No matching product</div>';
      }

      // ---- cart --------------------------------------------------------------------------------
      function renderCart() {
        const ids = Array.from(cart.keys());
        document.getElementById('clear-cart').hidden = !ids.length;
        let total = 0, count = 0, blocked = false;
        if (!ids.length) {
          cartBody.innerHTML = '<tr><td colspan="5" class="text-center text-secondary py-4">Nothing added yet. Pick products on the left.</td></tr>';
        } else {
          cartBody.innerHTML = ids.map(id => {
            const p = byId(id); const qty = cart.get(id);
            if (!p) return '';
            const over = qty > p.availableStock;
            if (over) blocked = true;
            const line = Number(p.price) * qty; total += line; count += qty;
            return '<tr data-id="' + id + '"' + (over ? ' class="table-danger"' : '') + '>' +
              '<td>' + UI.thumb(p) + ' <span class="fw-semibold ms-1">' + esc(p.name) + '</span>' +
                (over ? '<div class="small text-danger fw-semibold">Only ' + p.availableStock + ' available</div>' : '') + '</td>' +
              '<td><div class="input-group input-group-sm justify-content-center">' +
                '<button type="button" class="btn btn-outline-secondary" data-dec="' + id + '"><i class="bi bi-dash-lg"></i></button>' +
                '<input type="number" class="form-control text-center fw-bold" style="max-width:64px" value="' + qty + '" min="1" data-qty="' + id + '" inputmode="numeric">' +
                '<button type="button" class="btn btn-outline-secondary" data-inc="' + id + '"><i class="bi bi-plus-lg"></i></button></div></td>' +
              '<td class="text-end tt-money">' + esc(UI.money(p.price)) + '</td>' +
              '<td class="text-end tt-money fw-semibold">' + esc(UI.money(line)) + '</td>' +
              '<td class="text-end"><button type="button" class="btn btn-link text-danger p-0" data-remove="' + id + '" title="Remove"><i class="bi bi-trash"></i></button></td></tr>';
          }).join('');
        }
        document.getElementById('total').textContent = UI.money(total);
        document.getElementById('cart-count').textContent = count + ' item' + (count === 1 ? '' : 's');
        sellBtn.disabled = !ids.length || blocked || (!paidBox.checked && !customerInput.value.trim());
        renderList();
      }

      function add(id) {
        const p = byId(id);
        if (!p || p.availableStock <= 0) return;
        const qty = (cart.get(id) || 0);
        if (qty >= p.availableStock) { UI.toast('Only ' + p.availableStock + ' of ' + p.name + ' available.', 'warning'); return; }
        cart.set(id, qty + 1);
        renderCart();
      }
      function setQty(id, qty) {
        qty = Math.max(0, parseInt(qty, 10) || 0);
        if (qty === 0) cart.delete(id); else cart.set(id, qty);
        renderCart();
      }

      list.addEventListener('click', e => { const b = e.target.closest('[data-add]'); if (b) add(Number(b.dataset.add)); });
      cartBody.addEventListener('click', e => {
        const inc = e.target.closest('[data-inc]'), dec = e.target.closest('[data-dec]'), rm = e.target.closest('[data-remove]');
        if (inc) add(Number(inc.dataset.inc));
        if (dec) setQty(Number(dec.dataset.dec), (cart.get(Number(dec.dataset.dec)) || 1) - 1);
        if (rm) setQty(Number(rm.dataset.remove), 0);
      });
      cartBody.addEventListener('change', e => { const i = e.target.closest('[data-qty]'); if (i) setQty(Number(i.dataset.qty), i.value); });
      document.getElementById('clear-cart').addEventListener('click', () => { cart.clear(); renderCart(); });
      search.addEventListener('input', renderList);

      // ---- paid / customer ---------------------------------------------------------------------
      function updatePaid() {
        const paid = paidBox.checked;
        document.getElementById('paid-label').textContent = paid ? 'Paid' : 'NOT paid (credit)';
        document.getElementById('paid-help').textContent = paid ? 'Money received now.' : 'The customer will pay later. Their name is required.';
        document.getElementById('customer-opt').textContent = paid ? '(optional)' : '(required)';
        customerInput.required = !paid;
        sellBtn.classList.toggle('btn-success', paid);
        sellBtn.classList.toggle('btn-warning', !paid);
        renderCart();
      }
      paidBox.addEventListener('change', updatePaid);
      customerInput.addEventListener('input', renderCart);

      // ---- data --------------------------------------------------------------------------------
      async function loadProducts() {
        try { products = await Api.get('/api/products'); renderCart(); } catch (err) { UI.showError(err); }
      }

      async function loadToday() {
        try {
          const range = UI.period('today');
          const data = await Api.get('/api/sales', { query: { from: range.from, to: range.to, size: 10, sort: 'soldAt,desc' } });
          const body = document.getElementById('today-body');
          body.innerHTML = data.content.length ? data.content.map(s =>
            '<tr><td class="text-nowrap small">' + esc(UI.time(s.soldAt)) + '</td><td class="small text-secondary">' + esc(s.receiptNo) + '</td><td>' + esc(s.productName) +
            (s.paid ? '' : ' <span class="badge text-bg-danger">NOT PAID</span>') + '</td>' +
            '<td class="text-end">' + esc(UI.number(s.quantity)) + '</td><td class="text-end tt-money">' + esc(UI.money(s.total)) + '</td>' +
            '<td class="text-end"><button type="button" class="btn btn-link btn-sm p-0" data-receipt="' + esc(s.receiptNo) + '" title="Receipt"><i class="bi bi-receipt"></i></button></td></tr>').join('')
            : '<tr><td colspan="6" class="text-center text-secondary py-3">No sales yet today</td></tr>';
          document.getElementById('today-qty').textContent = UI.number(data.totalQuantity);
          document.getElementById('today-total').textContent = UI.money(data.totalAmount);
        } catch (err) { UI.showError(err); }
      }
      document.getElementById('today-body').addEventListener('click', e => {
        const b = e.target.closest('[data-receipt]');
        if (b) UI.openReceipt(b.dataset.receipt, false);
      });
      document.getElementById('print-receipt').addEventListener('click', () => { if (lastReceipt) UI.openReceipt(lastReceipt.receiptNo, true); });
      document.getElementById('open-receipt').addEventListener('click', () => { if (lastReceipt) UI.openReceipt(lastReceipt.receiptNo, false); });

      // ---- sell --------------------------------------------------------------------------------
      form.addEventListener('submit', async e => {
        e.preventDefault();
        if (!cart.size) return;
        result.hidden = true;
        UI.clearFieldErrors(form);
        UI.setLoading(sellBtn, true);
        try {
          const receipt = await Api.post('/api/sales', {
            items: Array.from(cart.entries()).map(([productId, quantity]) => ({ productId, quantity })),
            paid: paidBox.checked, customerName: customerInput.value.trim() || null
          }, { silent: true });
          lastReceipt = receipt;
          result.className = 'alert mt-3 ' + (receipt.paid ? 'alert-success' : 'alert-warning');
          resultText.innerHTML = '<i class="bi bi-check-circle me-2"></i><strong>Sold</strong> ' + esc(UI.number(receipt.itemCount)) + ' item' + (receipt.itemCount === 1 ? '' : 's') +
            ' (' + receipt.lines.map(l => esc(UI.number(l.quantity)) + ' × ' + esc(l.productName)).join(', ') + ')' +
            ' for <strong>' + esc(UI.money(receipt.total)) + '</strong> ' + UI.paidBadge(receipt.paid) +
            (receipt.customerName ? ' to <strong>' + esc(receipt.customerName) + '</strong>' : '') +
            '. Receipt No. <strong>' + esc(receipt.receiptNo) + '</strong>.';
          resultActions.hidden = false;
          result.hidden = false;
          cart.clear();
          customerInput.value = '';
          paidBox.checked = true;
          updatePaid();
          await Promise.all([loadProducts(), loadToday()]);
        } catch (err) {
          if (err.errors) UI.setFieldErrors(form, err.errors);
          result.className = 'alert alert-danger mt-3';
          resultText.innerHTML = '<i class="bi bi-exclamation-triangle me-2"></i>' + esc(Api.messageFor(err));
          resultActions.hidden = true;
          result.hidden = false;
          if (err.code === 'INSUFFICIENT_STOCK') loadProducts();
        } finally {
          UI.setLoading(sellBtn, false);
        }
      });

      await loadProducts();
      if (params.get('productId')) add(Number(params.get('productId')));
      updatePaid();
      loadToday();
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · THEO TECH LTD</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/app.css?v=10">
  <script src="/js/theme.js?v=10"></script>
</head>
<body data-page="dashboard" data-title="Dashboard">
  <div id="app-content" hidden>
    <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
      <div>
        <h2 class="h5 mb-0" id="company">THEO TECH LTD</h2>
        <div class="text-secondary small">Electronics Sales &amp; Stock Management</div>
      </div>
      <div class="ms-auto d-flex flex-wrap gap-2">
        <a class="btn btn-success" href="/sell.html"><i class="bi bi-cart-check me-1"></i>Sell Item</a>
        <a class="btn btn-outline-primary" href="/products.html?add=1" data-admin><i class="bi bi-plus-lg me-1"></i>Add Product</a>
        <a class="btn btn-outline-secondary" href="/stock.html"><i class="bi bi-clipboard-data me-1"></i>Stock</a>
        <button class="btn btn-outline-secondary" id="refresh" title="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
      </div>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-6 col-xl">
        <a class="card tt-stat-card h-100 text-decoration-none text-reset" href="/products.html"><div class="card-body d-flex align-items-center gap-3">
          <div class="tt-stat-icon bg-primary-subtle text-primary"><i class="bi bi-box-seam"></i></div>
          <div><div class="tt-stat-value" id="totalProducts">—</div><div class="tt-stat-label">Total products</div></div>
        </div></a>
      </div>
      <div class="col-6 col-xl">
        <a class="card tt-stat-card h-100 text-decoration-none text-reset" href="/stock.html"><div class="card-body d-flex align-items-center gap-3">
          <div class="tt-stat-icon bg-info-subtle text-info"><i class="bi bi-boxes"></i></div>
          <div><div class="tt-stat-value" id="itemsInStock">—</div><div class="tt-stat-label">Items in stock</div></div>
        </div></a>
      </div>
      <div class="col-6 col-xl">
        <a class="card tt-stat-card h-100 text-decoration-none text-reset" href="/sales.html"><div class="card-body d-flex align-items-center gap-3">
          <div class="tt-stat-icon bg-warning-subtle text-warning"><i class="bi bi-bag-check"></i></div>
          <div><div class="tt-stat-value" id="itemsSold">—</div><div class="tt-stat-label">Items sold</div></div>
        </div></a>
      </div>
      <div class="col-6 col-xl">
        <a class="card tt-stat-card h-100 text-decoration-none text-reset" href="/sales.html"><div class="card-body d-flex align-items-center gap-3">
          <div class="tt-stat-icon bg-success-subtle text-success"><i class="bi bi-cash-coin"></i></div>
          <div><div class="tt-stat-value tt-money" id="totalSales">—</div><div class="tt-stat-label">Total sales</div></div>
        </div></a>
      </div>
      <div class="col-6 col-xl">
        <a class="card tt-stat-card h-100 text-decoration-none text-reset" href="/sales.html?paid=false"><div class="card-body d-flex align-items-center gap-3">
          <div class="tt-stat-icon bg-danger-subtle text-danger"><i class="bi bi-hourglass-split"></i></div>
          <div><div class="tt-stat-value tt-money" id="unpaidAmount">—</div><div class="tt-stat-label">Not paid <span id="unpaidCount"></span></div></div>
        </div></a>
      </div>
      <div class="col-6 col-xl" data-admin>
        <a class="card tt-stat-card h-100 text-decoration-none text-reset" href="/expenses.html"><div class="card-body d-flex align-items-center gap-3">
          <div class="tt-stat-icon bg-warning-subtle text-warning"><i class="bi bi-wallet2"></i></div>
          <div><div class="tt-stat-value tt-money" id="totalExpenses">—</div><div class="tt-stat-label">Expenses</div></div>
        </div></a>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-lg-7">
        <div class="card h-100">
          <div class="card-header d-flex align-items-center">
            <span class="fw-semibold"><i class="bi bi-clock-history me-2 text-primary"></i>Recent sales</span>
            <a class="btn btn-link btn-sm ms-auto" href="/sales.html">Sales history</a>
          </div>
          <div class="table-responsive">
            <table class="table table-sm table-hover align-middle mb-0">
              <thead class="table-light"><tr><th>Product</th><th class="text-end">Qty</th><th class="text-end">Total</th><th class="d-none d-md-table-cell">By</th><th class="text-end">Date</th></tr></thead>
              <tbody id="recent"></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="col-lg-5">
        <div class="card mb-3">
          <div class="card-header d-flex align-items-center">
            <span class="fw-semibold text-warning-emphasis"><i class="bi bi-exclamation-triangle me-2"></i>Low stock</span>
            <span class="badge text-bg-warning text-dark ms-2" id="low-count">0</span>
            <span class="small text-secondary ms-auto" id="threshold-note"></span>
          </div>
          <ul class="list-group list-group-flush" id="low-list"></ul>
        </div>
        <div class="card">
          <div class="card-header d-flex align-items-center">
            <span class="fw-semibold text-danger-emphasis"><i class="bi bi-x-octagon me-2"></i>Out of stock</span>
            <span class="badge text-bg-danger ms-2" id="out-count">0</span>
          </div>
          <ul class="list-group list-group-flush" id="out-list"></ul>
        </div>
      </div>
    </div>
  </div>

  <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js?v=10"></script>
  <script src="/js/ui.js?v=10"></script>
  <script src="/js/auth.js?v=10"></script>
  <script src="/js/layout.js?v=10"></script>
  <script>
    document.addEventListener('app:ready', e => {
      const esc = UI.escapeHtml;
      const isAdmin = e.detail.isAdmin;

      function stockItem(p) {
        return '<li class="list-group-item d-flex align-items-center gap-2">' + UI.thumb(p) +
          '<span class="flex-grow-1">' + esc(p.name) + '<div class="small text-secondary">' + esc(p.categoryName || '') + '</div></span>' +
          '<span class="fw-bold fs-5">' + esc(UI.number(p.availableStock)) + '</span>' +
          (isAdmin ? '<a class="btn btn-outline-primary btn-sm" href="/stock.html?status=' + p.status + '" title="Add stock"><i class="bi bi-plus-lg"></i></a>' : '') +
        '</li>';
      }

      function render(d) {
        document.getElementById('totalProducts').textContent = UI.number(d.totalProducts);
        document.getElementById('itemsInStock').textContent = UI.number(d.itemsInStock);
        document.getElementById('itemsSold').textContent = UI.number(d.itemsSold);
        document.getElementById('totalSales').textContent = UI.money(d.totalSales);
        document.getElementById('unpaidAmount').textContent = UI.money(d.unpaidAmount);
        document.getElementById('unpaidCount').textContent = d.unpaidCount ? '(' + d.unpaidCount + ')' : '';
        const exp = document.getElementById('totalExpenses');
        if (exp) exp.textContent = UI.money(d.totalExpenses);
        document.getElementById('threshold-note').textContent = d.lowStockThreshold + ' or fewer';

        document.getElementById('low-count').textContent = d.lowStock.length;
        document.getElementById('low-list').innerHTML = d.lowStock.length ? d.lowStock.map(stockItem).join('')
          : '<li class="list-group-item text-secondary small">No product is running low.</li>';
        document.getElementById('out-count').textContent = d.outOfStock.length;
        document.getElementById('out-list').innerHTML = d.outOfStock.length ? d.outOfStock.map(stockItem).join('')
          : '<li class="list-group-item text-secondary small">Everything is in stock.</li>';

        const tbody = document.getElementById('recent');
        tbody.innerHTML = d.recentSales.length ? d.recentSales.map(s =>
          '<tr><td>' + esc(s.productName) + (s.paid ? '' : ' <span class="badge text-bg-danger">NOT PAID</span>') +
          (s.customerName ? '<div class="small text-secondary">' + esc(s.customerName) + '</div>' : '') + '</td><td class="text-end">' + esc(UI.number(s.quantity)) + '</td>' +
          '<td class="text-end tt-money">' + esc(UI.money(s.total)) + '</td><td class="d-none d-md-table-cell small text-secondary">' + esc(s.soldByName || '') + '</td>' +
          '<td class="text-end text-nowrap small text-secondary">' + esc(UI.dateTime(s.soldAt)) + '</td></tr>').join('')
          : '<tr><td colspan="5" class="text-center text-secondary py-4">No sales recorded yet. <a href="/sell.html">Sell the first item</a>.</td></tr>';
      }

      async function load() {
        try {
          const [d, s] = await Promise.all([Api.get('/api/dashboard'), Api.get('/api/settings')]);
          document.getElementById('company').textContent = s.companyName;
          render(d);
        } catch (err) { UI.showError(err); }
      }

      document.getElementById('refresh').addEventListener('click', load);
      load();
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Receipt · THEO TECH LTD</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/app.css?v=8">
</head>
<body class="tt-receipt-page">
  <div class="d-flex flex-wrap gap-2 justify-content-center mb-3 tt-no-print">
    <button class="btn btn-primary" id="print"><i class="bi bi-printer me-1"></i>Print</button>
    <button class="btn btn-success" id="mark-paid" hidden><i class="bi bi-cash-coin me-1"></i>Mark as paid</button>
    <a class="btn btn-outline-secondary" href="/sell.html"><i class="bi bi-cart-plus me-1"></i>Sell more</a>
    <a class="btn btn-outline-secondary" href="/sales.html"><i class="bi bi-clock-history me-1"></i>Sales history</a>
  </div>
  <div id="error" class="alert alert-danger mx-auto tt-no-print" style="max-width:380px" hidden></div>

  <div class="tt-receipt card shadow-sm p-3" id="receipt" hidden>
    <div class="text-center">
      <div class="tt-receipt-title" id="company">THEO TECH LTD</div>
      <div class="small" id="address"></div>
      <div class="small" id="phone"></div>
    </div>
    <div class="tt-dashed"></div>
    <table>
      <tr><td>Receipt No.</td><td class="text-end fw-bold" id="no"></td></tr>
      <tr><td>Date</td><td class="text-end" id="date"></td></tr>
      <tr><td>Served by</td><td class="text-end" id="by"></td></tr>
      <tr id="customer-row" hidden><td>Customer</td><td class="text-end fw-bold" id="customer"></td></tr>
    </table>
    <div class="tt-dashed"></div>
    <table>
      <thead><tr><td class="fw-bold">Item</td><td class="text-end fw-bold">Amount</td></tr></thead>
      <tbody id="lines"></tbody>
    </table>
    <div class="tt-dashed"></div>
    <table>
      <tr><td>Items</td><td class="text-end" id="count"></td></tr>
      <tr><td class="fs-5 fw-bold">TOTAL</td><td class="text-end fs-5 fw-bold tt-money" id="total"></td></tr>
    </table>
    <div class="text-center my-2"><span class="tt-stamp" id="stamp"></span><div class="small mt-1" id="paid-note"></div></div>
    <div class="tt-dashed"></div>
    <div class="text-center small">Thank you for your purchase!</div>
  </div>

  <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/js/theme.js?v=8"></script>
  <script src="/js/api.js?v=8"></script>
  <script src="/js/ui.js?v=8"></script>
  <script src="/js/auth.js?v=8"></script>
  <script>
    (async function () {
      // receipts print black on white whatever the app theme is
      document.documentElement.setAttribute('data-bs-theme', 'light');
      const params = new URLSearchParams(location.search);
      const esc = UI.escapeHtml;
      const errorBox = document.getElementById('error');
      const markPaid = document.getElementById('mark-paid');
      let receipt;

      function render(r) {
        receipt = r;
        document.getElementById('no').textContent = r.receiptNo;
        document.getElementById('date').textContent = UI.dateTime(r.soldAt);
        document.getElementById('by').textContent = r.soldByName || '';
        document.getElementById('customer-row').hidden = !r.customerName;
        document.getElementById('customer').textContent = r.customerName || '';
        document.getElementById('lines').innerHTML = r.lines.map(l =>
          '<tr><td>' + esc(l.productName) + '<div class="small text-secondary">' + esc(UI.number(l.quantity)) + ' × ' + esc(UI.money(l.unitPrice)) + '</div></td>' +
          '<td class="text-end tt-money">' + esc(UI.money(l.total)) + '</td></tr>').join('');
        document.getElementById('count').textContent = UI.number(r.itemCount);
        document.getElementById('total').textContent = UI.money(r.total);
        const stamp = document.getElementById('stamp');
        stamp.textContent = r.paid ? 'PAID' : 'NOT PAID';
        stamp.className = 'tt-stamp ' + (r.paid ? 'paid' : 'unpaid');
        document.getElementById('paid-note').textContent = r.paid ? (r.paidAt ? 'Paid on ' + UI.dateTime(r.paidAt) : '') : 'Amount still to be paid: ' + UI.money(r.total);
        markPaid.hidden = r.paid;
        document.title = 'Receipt ' + r.receiptNo + ' · ' + document.getElementById('company').textContent;
      }

      try {
        await Auth.load();
        let no = params.get('no');
        if (!no && params.get('id')) no = (await Api.get('/api/sales/' + encodeURIComponent(params.get('id')))).receiptNo;
        if (!no) throw new Api.ApiError(404, 'NOT_FOUND');
        const [r, settings] = await Promise.all([Api.get('/api/sales/receipt/' + encodeURIComponent(no)), Api.get('/api/settings')]);
        document.getElementById('company').textContent = settings.companyName;
        document.getElementById('address').textContent = settings.companyAddress || '';
        document.getElementById('phone').textContent = settings.companyPhone ? 'Tel: ' + settings.companyPhone : '';
        render(r);
        document.getElementById('receipt').hidden = false;
        if (params.get('print') === '1') setTimeout(() => window.print(), 300);
      } catch (err) {
        if (err && err.status === 401) return;
        errorBox.textContent = Api.messageFor(err);
        errorBox.hidden = false;
      }

      document.getElementById('print').addEventListener('click', () => window.print());
      markPaid.addEventListener('click', async () => {
        if (!receipt) return;
        UI.setLoading(markPaid, true);
        try {
          render(await Api.post('/api/sales/receipt/' + encodeURIComponent(receipt.receiptNo) + '/paid', { paid: true }));
          UI.toast('Marked as paid.', 'success');
        } catch (err) { UI.showError(err); }
        finally { UI.setLoading(markPaid, false); }
      });
    })();
  </script>
</body>
</html>

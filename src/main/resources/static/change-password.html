<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change password · THEO TECH LTD</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/app.css?v=8">
  <script src="/js/theme.js?v=8"></script>
</head>
<body class="tt-auth-page">
  <div class="card shadow-lg tt-auth-card">
    <div class="card-body p-4 p-md-5">
      <div class="mb-3">
        <div class="tt-auth-brand text-primary fs-5"><i class="bi bi-key me-2"></i>Set a new password</div>
        <div class="text-secondary small" id="who"></div>
      </div>

      <p class="text-secondary small" id="intro" hidden>For security you must choose a new password before continuing.</p>
      <div id="form-error" class="alert alert-danger py-2" role="alert" hidden></div>

      <form id="pw-form" novalidate>
        <div class="mb-3">
          <label class="form-label" for="currentPassword">Current password</label>
          <input class="form-control" id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label" for="newPassword">New password</label>
          <input class="form-control" id="newPassword" name="newPassword" type="password" autocomplete="new-password" required>
          <div class="form-text">At least 8 characters, with letters and digits.</div>
        </div>
        <div class="mb-4">
          <label class="form-label" for="confirmPassword">Confirm new password</label>
          <input class="form-control" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary flex-grow-1" type="submit" id="save-btn"><i class="bi bi-check2 me-1"></i>Save</button>
          <a class="btn btn-outline-secondary" href="/index.html" id="back-btn">Back</a>
          <button class="btn btn-outline-secondary" type="button" id="logout-btn">Log out</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js?v=8"></script>
  <script src="/js/ui.js?v=8"></script>
  <script src="/js/auth.js?v=8"></script>
  <script>
    (async function () {
      let me;
      try { me = await Auth.load(); } catch (e) { return; }
      document.getElementById('who').textContent = 'Signed in as ' + me.fullName + ' (' + me.username + ')';
      document.getElementById('intro').hidden = !me.mustChangePassword;
      document.getElementById('back-btn').hidden = me.mustChangePassword;
      document.getElementById('logout-btn').addEventListener('click', () => Auth.logout());

      const form = document.getElementById('pw-form');
      const errorBox = document.getElementById('form-error');
      const btn = document.getElementById('save-btn');

      form.addEventListener('submit', async e => {
        e.preventDefault();
        errorBox.hidden = true;
        UI.clearFieldErrors(form);
        if (form.newPassword.value !== form.confirmPassword.value) {
          UI.setFieldErrors(form, { confirmPassword: 'passwordMismatch' });
          return;
        }
        UI.setLoading(btn, true);
        try {
          await Api.post('/api/auth/change-password', {
            currentPassword: form.currentPassword.value,
            newPassword: form.newPassword.value
          }, { silent: true });
          UI.toast('Password changed.', 'success');
          setTimeout(() => location.replace('/index.html'), 600);
        } catch (err) {
          if (err.errors) UI.setFieldErrors(form, err.errors);
          else { errorBox.textContent = Api.messageFor(err); errorBox.hidden = false; }
        } finally {
          UI.setLoading(btn, false);
        }
      });
    })();
  </script>
</body>
</html>

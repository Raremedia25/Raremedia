spring:
  application:
    name: theo-tech-system
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate may only check it
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: theo-tech-pool
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true          # browsers revalidate every page/script (304 when unchanged); no stale JS after an update
  mvc:
    problemdetails:
      enabled: false              # we use our own envelope

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
  servlet:
    session:
      timeout: 8h
      cookie:
        name: THEOSESSION
        http-only: true
        same-site: lax
        secure: false             # set true behind HTTPS in production

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs/ui

app:
  security:
    remember-me-key: ${APP_REMEMBER_ME_KEY:change-me-in-production-please}
  timezone: Africa/Kigali

logging:
  level:
    root: INFO
    com.theotech: DEBUG
    org.springframework.security: INFO

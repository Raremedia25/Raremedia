spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/theo_tech
    username: postgres
    password: ${APP_DB_PASSWORD:theotech}
  jpa:
    show-sql: false
  web:
    resources:
      # serve the frontend straight from the folder while developing (edits show on refresh, no rebuild);
      # the packaged copy in the jar is the fallback
      static-locations: file:./frontend/,classpath:/static/

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
